name: multitask_bert_calibrated
output_root: experiments/multitask_distributional_bert/checkpoints/multitask_bert

data:
  dataset_name: BabyLM-community/BabyLM-2026-Strict-Small
  text_column: text
  validation_size: 2000
  num_proc: 4
  generated_dir: experiments/multitask_distributional_bert/data/generated

tokenizer:
  name: bert-base-uncased

model:
  hidden_size: 256
  num_hidden_layers: 4
  num_attention_heads: 4
  intermediate_size: 1024
  max_position_embeddings: 512

training:
  max_length: 128
  batch_size: 96
  max_steps: 10000
  calibration_mlm_steps: 2000
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_fraction: 0.06
  max_grad_norm: 1.0
  eval_every: 500
  eval_batches: 40
  precision: fp32
  early_stopping:
    enabled: true
    monitor: val_mlm_loss
    patience_evals: 2
    min_delta: 0.01
    start_after_step: 9000

tasks:
  mlm:
    probability: 0.60
    path: experiments/multitask_distributional_bert/data/generated/mlm.jsonl
  rtd:
    probability: 0.20
    path: experiments/multitask_distributional_bert/data/generated/rtd.jsonl
  connective:
    probability: 0.10
    path: experiments/multitask_distributional_bert/data/generated/connective.jsonl
  definiteness:
    probability: 0.10
    path: experiments/multitask_distributional_bert/data/generated/definiteness.jsonl
  collocation:
    probability: 0.00
    path: experiments/multitask_distributional_bert/data/generated/collocation.jsonl
  substitution:
    probability: 0.00
    path: experiments/multitask_distributional_bert/data/generated/substitution.jsonl

export:
  full_multitask_checkpoint: experiments/multitask_distributional_bert/checkpoints/multitask_bert/multitask_bert_calibrated/seed_1/full_multitask_checkpoint
  mlm_compatible_checkpoint: experiments/multitask_distributional_bert/checkpoints/multitask_bert/multitask_bert_calibrated/seed_1/mlm_compatible_checkpoint
