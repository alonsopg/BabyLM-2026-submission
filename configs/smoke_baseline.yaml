name: smoke_baseline
output_root: outputs
data:
  dataset_name: BabyLM-community/BabyLM-2026-Strict-Small
  text_column: text
  validation_size: 128
  max_train_rows: 512
  num_proc: 1
tokenizer:
  name: bert-base-uncased
model:
  hidden_size: 64
  num_hidden_layers: 2
  num_attention_heads: 2
  intermediate_size: 256
  max_position_embeddings: 256
training:
  max_length: 64
  batch_size: 8
  max_steps: 5
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_fraction: 0.0
  max_grad_norm: 1.0
  eval_every: 5
  eval_batches: 2
masking:
  type: random
  mask_rate: 0.15
