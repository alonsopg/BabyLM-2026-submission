name: multitask_ewok_semantic_cloze_v1
output_root: experiments/multitask_ewok_semantic_cloze_v1/checkpoints

data:
  dataset_name: BabyLM-community/BabyLM-2026-Strict-Small
  text_column: text
  validation_size: 2000
  num_proc: 4
  generated_dir: experiments/multitask_ewok_semantic_cloze_v1/data

tokenizer:
  name: bert-base-uncased

model:
  hidden_size: 256
  num_hidden_layers: 4
  num_attention_heads: 4
  intermediate_size: 1024
  max_position_embeddings: 512

training:
  max_length: 128
  batch_size: 96
  max_steps: 10000
  calibration_mlm_steps: 2000
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_fraction: 0.06
  max_grad_norm: 1.0
  eval_every: 500
  eval_batches: 40
  precision: fp32
  early_stopping:
    enabled: true
    monitor: val_mlm_loss
    patience_evals: 2
    min_delta: 0.01
    start_after_step: 9000

tasks:
  mlm:
    probability: 0.60
    path: experiments/multitask_ewok_semantic_cloze_v1/data/generated/mlm.jsonl
  rtd:
    probability: 0.10
    path: experiments/multitask_ewok_semantic_cloze_v1/data/generated/rtd.jsonl
  connective:
    probability: 0.075
    path: experiments/multitask_ewok_semantic_cloze_v1/data/generated/connective.jsonl
  definiteness:
    probability: 0.075
    path: experiments/multitask_ewok_semantic_cloze_v1/data/generated/definiteness.jsonl
  collocation:
    probability: 0.05
    path: experiments/multitask_ewok_semantic_cloze_v1/data/generated/collocation.jsonl
  grammar_minpair:
    probability: 0.05
    path: experiments/multitask_ewok_semantic_cloze_v1/data/grammar_minpair.jsonl
  semantic_cloze_ranking:
    probability: 0.05
    path: experiments/multitask_ewok_semantic_cloze_v1/data/semantic_cloze_ranking.jsonl

export:
  full_multitask_checkpoint: experiments/multitask_ewok_semantic_cloze_v1/checkpoints/multitask_ewok_semantic_cloze_v1/seed_1/full_multitask_checkpoint
  mlm_compatible_checkpoint: experiments/multitask_ewok_semantic_cloze_v1/checkpoints/multitask_ewok_semantic_cloze_v1/seed_1/mlm_compatible_checkpoint
