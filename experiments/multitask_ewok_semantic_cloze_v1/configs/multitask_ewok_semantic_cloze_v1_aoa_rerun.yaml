name: multitask_ewok_semantic_cloze_v1_aoa_rerun
output_root: experiments/multitask_ewok_semantic_cloze_v1/checkpoints_aoa_rerun

data:
  dataset_name: BabyLM-community/BabyLM-2026-Strict-Small
  text_column: text
  validation_size: 2000
  num_proc: 4
  generated_dir: experiments/multitask_ewok_semantic_cloze_v1/data

tokenizer:
  name: bert-base-uncased

model:
  hidden_size: 256
  num_hidden_layers: 4
  num_attention_heads: 4
  intermediate_size: 1024
  max_position_embeddings: 512

training:
  max_length: 128
  batch_size: 96
  max_steps: 10000
  calibration_mlm_steps: 2000
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_fraction: 0.06
  max_grad_norm: 1.0
  eval_every: 500
  eval_batches: 40
  precision: fp32
  early_stopping:
    enabled: true
    monitor: val_mlm_loss
    patience_evals: 2
    min_delta: 0.01
    start_after_step: 9000
  checkpoint_revisions:
    enabled: true
    output_dir: aoa_revisions
    schedule_by: step_fraction
    schedule_max_step: 9000
    names:
      - chck_1M
      - chck_2M
      - chck_3M
      - chck_4M
      - chck_5M
      - chck_6M
      - chck_7M
      - chck_8M
      - chck_9M
      - chck_10M
      - chck_20M
      - chck_30M
      - chck_40M
      - chck_50M
      - chck_60M
      - chck_70M
      - chck_80M
      - chck_90M
      - chck_100M

tasks:
  mlm:
    probability: 0.60
    path: experiments/multitask_ewok_semantic_cloze_v1/data/generated/mlm.jsonl
  rtd:
    probability: 0.10
    path: experiments/multitask_ewok_semantic_cloze_v1/data/generated/rtd.jsonl
  connective:
    probability: 0.075
    path: experiments/multitask_ewok_semantic_cloze_v1/data/generated/connective.jsonl
  definiteness:
    probability: 0.075
    path: experiments/multitask_ewok_semantic_cloze_v1/data/generated/definiteness.jsonl
  collocation:
    probability: 0.05
    path: experiments/multitask_ewok_semantic_cloze_v1/data/generated/collocation.jsonl
  grammar_minpair:
    probability: 0.05
    path: experiments/multitask_ewok_semantic_cloze_v1/data/grammar_minpair.jsonl
  semantic_cloze_ranking:
    probability: 0.05
    path: experiments/multitask_ewok_semantic_cloze_v1/data/semantic_cloze_ranking.jsonl

export:
  full_multitask_checkpoint: experiments/multitask_ewok_semantic_cloze_v1/checkpoints_aoa_rerun/multitask_ewok_semantic_cloze_v1_aoa_rerun/seed_1/full_multitask_checkpoint
  mlm_compatible_checkpoint: experiments/multitask_ewok_semantic_cloze_v1/checkpoints_aoa_rerun/multitask_ewok_semantic_cloze_v1_aoa_rerun/seed_1/mlm_compatible_checkpoint
