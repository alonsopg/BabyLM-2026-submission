name: multitask_mlm_pair_ranking_minimal_smoke100
output_root: experiments/multitask_mlm_pair_ranking_minimal/checkpoints
data:
  dataset_name: BabyLM-community/BabyLM-2026-Strict-Small
  text_column: text
  validation_size: 2000
  num_proc: 4
  generated_dir: experiments/multitask_mlm_pair_ranking_minimal/data/generated
tokenizer:
  name: bert-base-uncased
model:
  hidden_size: 256
  num_hidden_layers: 4
  num_attention_heads: 4
  intermediate_size: 1024
  max_position_embeddings: 512
training:
  max_length: 128
  batch_size: 96
  max_steps: 100
  calibration_mlm_steps: 0
  learning_rate: 0.0005
  weight_decay: 0.01
  warmup_fraction: 0.06
  max_grad_norm: 1.0
  eval_every: 100
  eval_batches: 40
  precision: fp32
  max_scoring_positions: 6
  early_stopping:
    enabled: true
    monitor: val_mlm_loss
    patience_evals: 2
    min_delta: 0.01
    start_after_step: 9000
tasks:
  mlm:
    probability: 0.55
    path: experiments/multitask_ewok_plausibility_minimal/data/generated/mlm.jsonl
  rtd:
    probability: 0.1
    path: experiments/multitask_ewok_plausibility_minimal/data/generated/rtd.jsonl
  connective:
    probability: 0.075
    path: experiments/multitask_ewok_plausibility_minimal/data/generated/connective.jsonl
  definiteness:
    probability: 0.075
    path: experiments/multitask_ewok_plausibility_minimal/data/generated/definiteness.jsonl
  collocation:
    probability: 0.05
    path: experiments/multitask_ewok_plausibility_minimal/data/generated/collocation.jsonl
  mlm_pair_ranking:
    probability: 0.15
    path: experiments/multitask_mlm_pair_ranking_minimal/data/generated/mlm_pair_ranking.jsonl
  conceptual_plausibility_choice:
    probability: 0.0
    path: experiments/multitask_ewok_plausibility_minimal/data/generated/conceptual_plausibility_choice.jsonl
  substitution:
    probability: 0.0
    path: experiments/multitask_ewok_plausibility_minimal/data/generated/substitution.jsonl
  function_word_recovery:
    probability: 0.0
    path: experiments/multitask_ewok_plausibility_minimal/data/generated/function_word_recovery.jsonl
  agreement_prediction:
    probability: 0.0
    path: experiments/multitask_ewok_plausibility_minimal/data/generated/agreement_prediction.jsonl
  grammar_minpair:
    probability: 0.0
    path: experiments/multitask_ewok_plausibility_minimal/data/generated/grammar_minpair.jsonl
export:
  full_multitask_checkpoint: experiments/multitask_mlm_pair_ranking_minimal/checkpoints/multitask_mlm_pair_ranking_minimal/seed_1/full_multitask_checkpoint
  mlm_compatible_checkpoint: experiments/multitask_mlm_pair_ranking_minimal/checkpoints/multitask_mlm_pair_ranking_minimal/seed_1/mlm_compatible_checkpoint
