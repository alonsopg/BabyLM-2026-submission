name: normal_bert_mlm
output_root: experiments/multitask_distributional_bert/checkpoints/normal_bert
data:
  dataset_name: BabyLM-community/BabyLM-2026-Strict-Small
  text_column: text
  validation_size: 2000
  num_proc: 4
tokenizer:
  name: bert-base-uncased
model:
  hidden_size: 256
  num_hidden_layers: 4
  num_attention_heads: 4
  intermediate_size: 1024
  max_position_embeddings: 512
training:
  max_length: 128
  batch_size: 96
  max_steps: 10000
  learning_rate: 0.0005
  weight_decay: 0.01
  warmup_fraction: 0.06
  max_grad_norm: 1.0
  eval_every: 500
  eval_batches: 40
  precision: fp32
masking:
  type: random
  mask_rate: 0.15
