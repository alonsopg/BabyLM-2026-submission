name: hh_error_only
output_root: outputs
data:
  dataset_name: BabyLM-community/BabyLM-2026-Strict-Small
  text_column: text
  validation_size: 2000
  num_proc: 4
tokenizer:
  name: bert-base-uncased
model:
  hidden_size: 256
  num_hidden_layers: 4
  num_attention_heads: 4
  intermediate_size: 1024
  max_position_embeddings: 512
training:
  max_length: 128
  batch_size: 64
  max_steps: 10000
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_fraction: 0.06
  max_grad_norm: 1.0
  eval_every: 500
  eval_batches: 40
masking:
  type: heavy_hitter
  mask_rate: 0.15
  random_share: 0.75
  entity_share: 0.00
  error_share: 0.25
  error_sketch_capacity: 10000
  error_warmup_fraction: 0.10
  error_update_percentile: 0.75
